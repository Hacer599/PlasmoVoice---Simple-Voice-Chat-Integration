# This file pins the JVM that runs the Gradle daemon.
# fabric-loom 1.16.x and Minecraft 1.21.x require a Java 21+ JVM, even when
# JAVA_HOME still points at an older JDK. Gradle picks a compatible installed
# JDK automatically, so `gradlew build` works from any shell.
toolchainVersion=21
